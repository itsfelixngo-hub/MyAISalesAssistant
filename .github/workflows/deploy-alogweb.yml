# Per-project deploy. One workflow + one self-hosted runner label per project.
# To add another project, copy this file and change PROJECT, the runner label,
# the paths filter, and the ALOGWEB_* variable names.
#
# Configure under Settings → Environments → alogweb-production.
#
# An environment rather than repository-wide settings, for two reasons. This
# repository holds more than one project, and repository secrets are readable by
# every workflow in it. And workflow_dispatch can be run from any ref - the
# branches filter below only constrains push - so without an environment branch
# rule, anyone can dispatch a production deploy from main.
#
#   Variables (not secret, visible in logs)
#     ALOGWEB_APP_DIR        deploy root on the VPS (default /home/deploy/apps/alogweb)
#     ALOGWEB_SITE_URL       required, e.g. http://203.0.113.10:8093 then https://alogweb.com
#     ALOGWEB_HTTP_PORT      default 8093; 80 once DNS points here
#     ALOGWEB_TABLE_PREFIX   default apk_ - must match the dump
#     ALOGWEB_CONTACT_*      contact form addresses and SMTP host/port
#
#   Secrets (masked in logs)
#     ALOGWEB_MYSQL_PASSWORD        required
#     ALOGWEB_MYSQL_ROOT_PASSWORD   required
#     ALOGWEB_SMTP_USER             optional
#     ALOGWEB_SMTP_PASSWORD         optional
#
# Nothing is stored on the VPS by hand: .env is rewritten from these on every
# run, so the repository settings are the single source of truth.
name: Deploy alogweb

on:
  push:
    branches: [deploy/alogweb]
    paths:
      - 'projects/alogweb/**'
      - 'shared/plugins/ai-post-content-writer/**'
      - '.github/workflows/deploy-alogweb.yml'
  workflow_dispatch:
    inputs:
      reseed_database:
        description: 'DESTRUCTIVE: drop the database and re-import the dump'
        type: boolean
        default: false

concurrency:
  group: deploy-alogweb
  cancel-in-progress: false

env:
  PROJECT: alogweb

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, linux, alogweb]
    timeout-minutes: 30

    # Scopes the secrets to this job and lets a branch rule enforce that
    # production is only ever deployed from deploy/alogweb.
    environment:
      name: alogweb-production
      url: ${{ vars.ALOGWEB_SITE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy root
        env:
          APP_DIR_INPUT: ${{ vars.ALOGWEB_APP_DIR }}
        run: |
          set -euo pipefail
          APP_DIR="${APP_DIR_INPUT:-/home/deploy/apps/alogweb}"
          case "$APP_DIR" in
            /*) ;;
            *) echo "ALOGWEB_APP_DIR must be an absolute path, got: $APP_DIR"; exit 1 ;;
          esac
          echo "APP_DIR=$APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$APP_DIR/projects/$PROJECT" >> "$GITHUB_ENV"

      - name: Preflight
        run: |
          set -euo pipefail
          for tool in docker rsync curl; do
            command -v "$tool" >/dev/null || { echo "missing on runner: $tool"; exit 1; }
          done
          docker compose version >/dev/null
          docker info >/dev/null

          mkdir -p "$PROJECT_DIR/database"
          test -w "$APP_DIR"

      - name: Sync source to VPS
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR" "$APP_DIR/shared"

          # Secrets, dumps and backups on the VPS are never touched: --delete
          # leaves excluded paths alone.
          rsync -a --delete \
            --exclude='.env' \
            --exclude='database/*.sql' \
            --exclude='database/*.sql.gz' \
            --exclude='backups/' \
            --exclude='uploads/' \
            "$GITHUB_WORKSPACE/projects/$PROJECT/" "$PROJECT_DIR/"

          rsync -a --delete --exclude='.env' \
            "$GITHUB_WORKSPACE/shared/" "$APP_DIR/shared/"

          chmod +x "$PROJECT_DIR"/scripts/*.sh

      - name: Write .env from repository settings
        env:
          # Variables
          SITE_URL:                   ${{ vars.ALOGWEB_SITE_URL }}
          HTTP_PORT:                  ${{ vars.ALOGWEB_HTTP_PORT }}
          HTTP_BIND_ADDRESS:          ${{ vars.ALOGWEB_HTTP_BIND_ADDRESS }}
          HTTPS_PORT:                 ${{ vars.ALOGWEB_HTTPS_PORT }}
          MYSQL_DATABASE:             ${{ vars.ALOGWEB_MYSQL_DATABASE }}
          MYSQL_USER:                 ${{ vars.ALOGWEB_MYSQL_USER }}
          WORDPRESS_TABLE_PREFIX:     ${{ vars.ALOGWEB_TABLE_PREFIX }}
          MYSQL_PORT:                 ${{ vars.ALOGWEB_MYSQL_PORT }}
          WORDPRESS_DEBUG:            ${{ vars.ALOGWEB_WORDPRESS_DEBUG }}
          WP_AUTO_UPDATE_CORE:        ${{ vars.ALOGWEB_WP_AUTO_UPDATE_CORE }}
          ALOGWEB_ADMIN_BAR:          ${{ vars.ALOGWEB_ADMIN_BAR }}
          CONTAINER_PREFIX:           ${{ vars.ALOGWEB_CONTAINER_PREFIX }}
          ALOGWEB_MYSQL_VOLUME:       ${{ vars.ALOGWEB_MYSQL_VOLUME }}
          ALOGWEB_WORDPRESS_VOLUME:   ${{ vars.ALOGWEB_WORDPRESS_VOLUME }}
          ALOGWEB_NETWORK:            ${{ vars.ALOGWEB_NETWORK }}
          SITE_CONTACT_EMAIL:         ${{ vars.ALOGWEB_CONTACT_EMAIL }}
          CONTACT_FORWARD_TO:         ${{ vars.ALOGWEB_CONTACT_FORWARD_TO }}
          CONTACT_FROM_EMAIL:         ${{ vars.ALOGWEB_CONTACT_FROM_EMAIL }}
          CONTACT_SMTP_HOST:          ${{ vars.ALOGWEB_SMTP_HOST }}
          CONTACT_SMTP_PORT:          ${{ vars.ALOGWEB_SMTP_PORT }}
          CONTACT_SMTP_USE_TLS:       ${{ vars.ALOGWEB_SMTP_USE_TLS }}
          CONTACT_SMTP_TLS_VERIFY:    ${{ vars.ALOGWEB_SMTP_TLS_VERIFY }}
          CONTACT_RATE_LIMIT_SECONDS: ${{ vars.ALOGWEB_CONTACT_RATE_LIMIT_SECONDS }}
          CONTACT_MIN_SUBMIT_SECONDS: ${{ vars.ALOGWEB_CONTACT_MIN_SUBMIT_SECONDS }}
          CONTACT_ROTATION_TOLERANCE: ${{ vars.ALOGWEB_CONTACT_ROTATION_TOLERANCE }}
          # Optional features. Blank is a valid answer and means the feature stays
          # off; write-env.sh substitutes its own default for anything empty, so
          # listing a variable here can never break a default.
          ALOGWEB_STATIC_HOST:        ${{ vars.ALOGWEB_STATIC_HOST }}
          ALOGWEB_CF_BEACON_TOKEN:    ${{ vars.ALOGWEB_CF_BEACON_TOKEN }}
          ALOGWEB_GA_MEASUREMENT_ID:  ${{ vars.ALOGWEB_GA_MEASUREMENT_ID }}
          ALOGWEB_ANALYTICS_HTML_B64: ${{ vars.ALOGWEB_ANALYTICS_HTML_B64 }}
          # A zone id is not sensitive, so take one from either place rather than
          # making it matter which was picked.
          CLOUDFLARE_ZONE_ID:         ${{ secrets.CLOUDFLARE_ZONE_ID || vars.ALOGWEB_CLOUDFLARE_ZONE_ID }}
          # Infrastructure. All of these have defaults in write-env.sh; they are
          # here so a value can be changed without editing the repository.
          HTTPS_BIND_ADDRESS:         ${{ vars.ALOGWEB_HTTPS_BIND_ADDRESS }}
          MYSQL_BIND_ADDRESS:         ${{ vars.ALOGWEB_MYSQL_BIND_ADDRESS }}
          DISABLE_WP_CRON:            ${{ vars.ALOGWEB_DISABLE_WP_CRON }}
          ALOGWEB_WP_IMAGE:           ${{ vars.ALOGWEB_WP_IMAGE }}
          ALOGWEB_WPCLI_IMAGE:        ${{ vars.ALOGWEB_WPCLI_IMAGE }}
          ALOGWEB_BACKUP_KEEP_DAYS:   ${{ vars.ALOGWEB_BACKUP_KEEP_DAYS }}
          COMPOSE_PROJECT_NAME:       ${{ vars.ALOGWEB_COMPOSE_PROJECT_NAME }}
          ALOGWEB_NGINX_LOG_VOLUME:        ${{ vars.ALOGWEB_NGINX_LOG_VOLUME }}
          ALOGWEB_NGINX_CACHE_VOLUME:      ${{ vars.ALOGWEB_NGINX_CACHE_VOLUME }}
          ALOGWEB_NGINX_PAGE_CACHE_VOLUME: ${{ vars.ALOGWEB_NGINX_PAGE_CACHE_VOLUME }}
          ALOGWEB_CERTBOT_WEBROOT_VOLUME:  ${{ vars.ALOGWEB_CERTBOT_WEBROOT_VOLUME }}
          # Secrets
          MYSQL_PASSWORD:             ${{ secrets.ALOGWEB_MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD:        ${{ secrets.ALOGWEB_MYSQL_ROOT_PASSWORD }}
          CONTACT_SMTP_USER:          ${{ secrets.ALOGWEB_SMTP_USER }}
          CONTACT_SMTP_PASSWORD:      ${{ secrets.ALOGWEB_SMTP_PASSWORD }}
          CLOUDFLARE_API_TOKEN:       ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALOGWEB_ENV_FILE:           ${{ env.PROJECT_DIR }}/.env
        run: |
          set -euo pipefail
          if [ -z "${MYSQL_PASSWORD:-}" ] || [ -z "${MYSQL_ROOT_PASSWORD:-}" ] || [ -z "${SITE_URL:-}" ]; then
            if [ -f "$PROJECT_DIR/.env" ]; then
              echo "::warning::ALOGWEB_SITE_URL / MYSQL secrets are not set; keeping the .env already on the VPS."
              exit 0
            fi
            echo "Set ALOGWEB_SITE_URL (variable) and ALOGWEB_MYSQL_PASSWORD /"
            echo "ALOGWEB_MYSQL_ROOT_PASSWORD (secrets) under Settings →"
            echo "Secrets and variables → Actions, or place a .env on the VPS."
            exit 1
          fi
          "$PROJECT_DIR/scripts/write-env.sh"

      - name: Check database dump is present
        run: |
          set -euo pipefail
          if ls "$PROJECT_DIR"/database/*.sql "$PROJECT_DIR"/database/*.sql.gz >/dev/null 2>&1; then
            ls -lh "$PROJECT_DIR"/database/*.sql* 2>/dev/null
          else
            echo "::warning::No SQL dump in $PROJECT_DIR/database/."
            echo "::warning::The first deploy needs one: scp the export there. Exactly one file."
          fi

      - name: Deploy stack
        env:
          ALOGWEB_RESEED: ${{ inputs.reseed_database && '1' || '0' }}
        run: "$PROJECT_DIR/scripts/deploy.sh"

      - name: Collect logs on failure
        if: failure()
        run: |
          cd "$PROJECT_DIR"
          docker compose --env-file .env -f docker-compose.yml ps || true
          docker compose --env-file .env -f docker-compose.yml logs --tail=200 || true
