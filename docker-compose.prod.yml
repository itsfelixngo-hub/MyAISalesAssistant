version: "3.9"

services:
  wordpress:
    image: wordpress:6.7.2-php8.1-apache
    container_name: maa_wordpress_prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8083:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      AIPCW_PROJECT_ID: my-ai-sales-assistant
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', false);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('FS_METHOD', 'direct');
    volumes:
      - wordpress_data:/var/www/html
      - ./shared/plugins/ai-post-content-writer:/var/www/html/wp-content/plugins/my-ai-sales-assistant
    networks:
      - maa_net

  aipcw_worker:
    image: wordpress:cli-php8.1
    container_name: maa_aipcw_worker_prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      AIPCW_PROJECT_ID: my-ai-sales-assistant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wordpress_data:/var/www/html
      - ./shared/plugins/ai-post-content-writer:/var/www/html/wp-content/plugins/my-ai-sales-assistant
    command: sh -c "while true; do wp aipcw worker --path=/var/www/html --once || true; sleep 5; done"
    networks:
      - maa_net

  mysql:
    image: mysql:8.0
    container_name: maa_mysql_prod
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - maa_net

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: maa_phpmyadmin_prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8084:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 128M
    networks:
      - maa_net

  mongo:
    image: mongo:7
    container_name: maa_mongo_prod
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
      - ./data/backup:/data/backup
    networks:
      - maa_net

  backend:
    image: samsung_edu-nestjs:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maa_backend_prod
    restart: unless-stopped
    working_dir: /app
    user: "1000:1000"
    depends_on:
      - mongo
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: http://localhost:8083
      MONGO_URI: mongodb://mongo:27017/dbsamsung_edu
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/logs/requests:/app/logs/requests
    networks:
      - maa_net

volumes:
  wordpress_data:
  mysql_data:
  mongo_data:

networks:
  maa_net:
    driver: bridge
