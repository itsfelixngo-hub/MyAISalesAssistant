# Alogweb - 3-container stack: nginx (web) -> wordpress (php-fpm) -> mysql
#
# Run from this directory:
#   docker compose up -d
# Or from the repo root:
#   docker compose -f projects/alogweb/docker-compose.yml up -d
#
# Environment comes from ./.env (see .env.production.example).

# Namespaced on purpose: a bare "alogweb" collides with any other compose
# project living in a directory of that name.
#
# Override with COMPOSE_PROJECT_NAME in .env to run a second copy of this stack
# from another checkout. Without that, compose treats both as the same project
# and `up -d` in one silently replaces the containers of the other, however
# different their container names are.
name: maa-alogweb

x-wordpress-env: &wordpress-env
    WORDPRESS_DB_HOST: alogweb-mysql:3306
    WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-alogweb_wordpress}
    WORDPRESS_DB_USER: ${MYSQL_USER:-alogweb}
    WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-apk_}
    # The image defines WP_DEBUG from this before it evaluates
    # WORDPRESS_CONFIG_EXTRA, so debug must be set here. Empty = off;
    # ANY non-empty value is truthy, including the string "false".
    WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-}
    AIPCW_PROJECT_ID: alogweb
    # The measurement beacon. Injected only on public front-end views, never
    # on wp-admin and never for a logged-in user - see
    # theme/apk/inc/alogweb-analytics.php. All empty means no beacon.
    # Cloudflare cache purge, from Tools -> Purge cache. Kept in the
    # environment rather than wp_options: a token in the database ends up
    # in every dump and every backup. Needs one permission on the token:
    # Zone -> Cache Purge -> Purge.
    CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
    ALOGWEB_CF_BEACON_TOKEN: ${ALOGWEB_CF_BEACON_TOKEN:-}
    ALOGWEB_GA_MEASUREMENT_ID: ${ALOGWEB_GA_MEASUREMENT_ID:-}
    ALOGWEB_ANALYTICS_HTML_B64: ${ALOGWEB_ANALYTICS_HTML_B64:-}
    # 1 puts the WordPress admin bar back on the front end.
    ALOGWEB_ADMIN_BAR: ${ALOGWEB_ADMIN_BAR:-0}
    # Pin the screenshot proxy host. Empty derives it from SITE_URL, which
    # is right for the apex and wrong for anything the wildcard cert does
    # not cover - or for an IP, where nothing is derived at all.
    ALOGWEB_STATIC_HOST: ${ALOGWEB_STATIC_HOST:-}
    # Contact form. Same variable names the ExchangeHub app already reads, so
    # one set of SMTP values configures both sites. An empty CONTACT_SMTP_HOST
    # means no SMTP is configured and the form reports a send failure rather
    # than pretending the message went out.
    SITE_CONTACT_EMAIL: ${SITE_CONTACT_EMAIL:-}
    CONTACT_FORWARD_TO: ${CONTACT_FORWARD_TO:-}
    CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
    CONTACT_SMTP_HOST: ${CONTACT_SMTP_HOST:-}
    CONTACT_SMTP_PORT: ${CONTACT_SMTP_PORT:-587}
    CONTACT_SMTP_USER: ${CONTACT_SMTP_USER:-}
    CONTACT_SMTP_PASSWORD: ${CONTACT_SMTP_PASSWORD:-}
    CONTACT_SMTP_USE_TLS: ${CONTACT_SMTP_USE_TLS:-true}
    CONTACT_SMTP_TLS_VERIFY: ${CONTACT_SMTP_TLS_VERIFY:-true}
    CONTACT_RATE_LIMIT_SECONDS: ${CONTACT_RATE_LIMIT_SECONDS:-60}
    CONTACT_MIN_SUBMIT_SECONDS: ${CONTACT_MIN_SUBMIT_SECONDS:-3}
    CONTACT_ROTATION_TOLERANCE: ${CONTACT_ROTATION_TOLERANCE:-8}
    # WP_HOME/WP_SITEURL are forced here so they win over the values stored in
    # the imported dump. Change SITE_URL in .env when the DNS is pointed at the
    # VPS, then redeploy - no database edit needed.
    WORDPRESS_CONFIG_EXTRA: |
      define('WP_HOME', '${SITE_URL:-http://localhost:8093}');
      define('WP_SITEURL', '${SITE_URL:-http://localhost:8093}');
      if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
      }
      if (isset($$_SERVER['HTTP_X_FORWARDED_FOR'])) {
          $$_SERVER['REMOTE_ADDR'] = trim(explode(',', $$_SERVER['HTTP_X_FORWARDED_FOR'])[0]);
      }
      // Outside the document root on purpose. Left at the default, WordPress
      // writes wp-content/debug.log, which nginx then happily serves to anyone
      // who asks - a file full of absolute paths, queries and plugin internals.
      // /tmp is the one place www-data can write that no vhost maps to.
      if (!defined('WP_DEBUG_LOG')) define('WP_DEBUG_LOG', '/tmp/alogweb-debug.log');
      if (!defined('WP_DEBUG_DISPLAY')) define('WP_DEBUG_DISPLAY', false);
      define('DISALLOW_FILE_EDIT', true);
      define('DISABLE_WP_CRON', ${DISABLE_WP_CRON:-true});
      // Core updated itself from the image's 6.7.2 to 7.1 inside the
      // volume. Security and minor releases stay automatic; a major
      // jump should be a deliberate image bump, not a surprise.
      define('WP_AUTO_UPDATE_CORE', '${WP_AUTO_UPDATE_CORE:-minor}');
      define('FS_METHOD', 'direct');

services:
  alogweb-mysql:
    image: mysql:8.0
    container_name: ${CONTAINER_PREFIX:-maa_alogweb}_mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_520_ci
      - --max_allowed_packet=256M
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alogweb_wordpress}
      MYSQL_USER: ${MYSQL_USER:-alogweb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    # Bound to loopback by default so the database is not exposed publicly.
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3317}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - alogweb_net

  alogweb-wordpress:
    # Pinned, and pinned to the version that produced the seed dump. A fresh
    # container on an older tag stamps its own lower db_version over the one in
    # the dump - core update-db reports it as an upgrade while it is a
    # downgrade, and the site then runs newer data on older code.
    image: wordpress:${ALOGWEB_WP_IMAGE:-7.1-php8.2-fpm}
    container_name: ${CONTAINER_PREFIX:-maa_alogweb}_wordpress
    restart: unless-stopped
    depends_on:
      alogweb-mysql:
        condition: service_healthy
    environment:
      <<: *wordpress-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wordpress_data:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-alogweb.ini:ro
      - ./php/www.conf:/usr/local/etc/php-fpm.d/zz-alogweb.conf:ro
      - ../../shared/plugins/ai-post-content-writer:/var/www/html/wp-content/plugins/my-ai-sales-assistant
      - ./theme/apk:/var/www/html/wp-content/themes/apk
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);' && test -f /var/www/html/wp-load.php"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - alogweb_net

  alogweb-nginx:
    image: nginx:1.27-alpine
    container_name: ${CONTAINER_PREFIX:-maa_alogweb}_nginx
    restart: unless-stopped
    depends_on:
      alogweb-wordpress:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8093}:80"
    volumes:
      # Same WordPress root as php-fpm, read-only: nginx serves static files
      # directly and only hands .php requests to the fpm container.
      - wordpress_data:/var/www/html:ro
      # A bind mounted inside a named volume is visible only in the container
      # that declares it, so nginx needs the same theme/plugin binds or every
      # theme asset would 404 here while php-fpm still sees the files.
      - ../../shared/plugins/ai-post-content-writer:/var/www/html/wp-content/plugins/my-ai-sales-assistant:ro
      - ./theme/apk:/var/www/html/wp-content/themes/apk:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/static-cache.conf:/etc/nginx/conf.d/00-static-cache.conf:ro
      - ./nginx/fastcgi-cache.conf:/etc/nginx/conf.d/00-fastcgi-cache.conf:ro
      - ./nginx/static.conf:/etc/nginx/conf.d/static.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - nginx_logs:/var/log/nginx
      - nginx_cache:/var/cache/nginx/static
      - nginx_page_cache:/var/cache/nginx/fastcgi
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - alogweb_net

  # Drives every queue in the AI plugin - content generation and the store
  # maintenance sweeps. Starting a job only flags it as running and schedules a
  # cron event, and DISABLE_WP_CRON above means that event never fires, so
  # something has to tick the queue. The admin page does it from the browser
  # while it is open; this container is for runs left unattended.
  #   docker compose --profile worker up -d alogweb-worker
  alogweb-worker:
    image: wordpress:cli-php8.1
    container_name: ${CONTAINER_PREFIX:-maa_alogweb}_worker
    profiles: ["worker"]
    restart: unless-stopped
    depends_on:
      alogweb-wordpress:
        condition: service_healthy
    working_dir: /var/www/html
    environment:
      <<: *wordpress-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wordpress_data:/var/www/html
      - ../../shared/plugins/ai-post-content-writer:/var/www/html/wp-content/plugins/my-ai-sales-assistant
      - ./theme/apk:/var/www/html/wp-content/themes/apk
    command: sh -c "while true; do wp aipcw tick --path=/var/www/html || true; sleep 5; done"
    networks:
      - alogweb_net

volumes:
  mysql_data:
    name: ${ALOGWEB_MYSQL_VOLUME:-alogweb_mysql_data}
  wordpress_data:
    name: ${ALOGWEB_WORDPRESS_VOLUME:-alogweb_wordpress_data}
  nginx_logs:
    name: ${ALOGWEB_NGINX_LOG_VOLUME:-alogweb_nginx_logs}
  nginx_cache:
    name: ${ALOGWEB_NGINX_CACHE_VOLUME:-alogweb_nginx_cache}
  nginx_page_cache:
    name: ${ALOGWEB_NGINX_PAGE_CACHE_VOLUME:-alogweb_nginx_page_cache}

networks:
  alogweb_net:
    name: ${ALOGWEB_NETWORK:-alogweb_net}
