# HTTPS for the screenshot proxy. Enabled only through docker-compose.ssl.yml,
# because the certificate files do not exist during the IP:port test phase and
# nginx refuses to start when ssl_certificate points at a missing file.
#
# It is mounted over conf.d/static.conf, replacing the plain-HTTP server, so
# the two never both claim server_name ~^static\..+$ on port 80.
#
# Certbot on the host issues the certificate; the container mounts
# /etc/letsencrypt read-only. Edit the two paths below if the static host is
# not static.alogweb.com.

server {
    listen 443 ssl;
    http2 on;
    server_name ~^static\..+$;

    ssl_certificate     /etc/letsencrypt/live/static.alogweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/static.alogweb.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/static-proxy.conf;
}

server {
    listen 80;
    server_name ~^static\..+$;

    # Keep the ACME path on plain HTTP so certbot can renew.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
