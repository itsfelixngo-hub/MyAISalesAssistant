# Alogweb front web server.
# Serves the WordPress root read-only and proxies PHP to the php-fpm container.

map $http_x_forwarded_proto $alogweb_https {
    default "";
    https   on;
}

# No `keepalive` here and no `fastcgi_keep_conn` below, on purpose. Enabling
# fastcgi keepalive against php-fpm stalls this stack badly under load: measured
# 30 concurrent requests went from 0.11s to 64s for the slowest response, and a
# PHP file that does not even load WordPress showed the same stall. Leave it off.
upstream alogweb_php {
    server alogweb-wordpress:9000;
}

server {
    listen      80 default_server;
    # "_" matches both http://<vps-ip>:<port> during testing and the real
    # domain once DNS is pointed here. No change needed at cutover.
    server_name _;

    root  /var/www/html;
    index index.php;

    client_max_body_size 128M;
    server_tokens off;

    access_log /var/log/nginx/alogweb.access.log;
    error_log  /var/log/nginx/alogweb.error.log warn;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml application/rss+xml
                      image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Container-level health probe. Does not touch PHP.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hidden files, except the ACME challenge used by certbot later.
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Browsers and crawlers request this path regardless of what the markup
    # says, and WordPress would answer it with a 404 page.
    location = /favicon.ico {
        alias /var/www/html/wp-content/themes/apk/assets/icons/favicon.ico;
        expires 30d;
        access_log off;
        log_not_found off;
    }

    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /wp-config.php { deny all; }
    location ~* ^/(readme|license)\.(html|txt)$ { deny all; access_log off; }

    # No PHP execution from writable content directories.
    location ~* ^/wp-content/.*\.(php|phtml|phar)$ { deny all; }
    location ~* ^/wp-includes/.*\.php$            { deny all; }

    location ~* \.(?:css|js|mjs|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|ogg|pdf|zip|apk)$ {
        expires 30d;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # --- Optional: serve missing media from the live site while testing ------
    # The imported dump references https://apk.alogweb.com/wp-content/uploads/...
    # but a fresh VPS volume has no uploads yet. Uncomment to fall back to the
    # live site for any upload that is not on disk. Remove before DNS cutover.
    #
    # location ^~ /wp-content/uploads/ {
    #     try_files $uri @live_uploads;
    # }
    # location @live_uploads {
    #     proxy_pass         https://apk.alogweb.com;
    #     proxy_set_header   Host apk.alogweb.com;
    #     proxy_ssl_server_name on;
    #     proxy_intercept_errors on;
    # }
    # ------------------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include       fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTPS           $alogweb_https if_not_empty;

        fastcgi_pass          alogweb_php;
        fastcgi_index         index.php;
        fastcgi_read_timeout  300s;

        # Full-page cache. Logged-in editors, POSTs, admin, search, feeds and
        # the download step always bypass it - see nginx/fastcgi-cache.conf.
        fastcgi_cache            alogweb_page;
        fastcgi_cache_valid      200 301 302 1h;
        fastcgi_cache_valid      404 5m;
        fastcgi_cache_methods    GET HEAD;
        fastcgi_cache_lock       on;
        fastcgi_cache_lock_timeout 10s;
        fastcgi_cache_background_update on;
        fastcgi_cache_use_stale  error timeout invalid_header updating http_500 http_503;
        fastcgi_no_cache         $alogweb_skip_cache;
        fastcgi_cache_bypass     $alogweb_skip_cache;
        add_header X-Page-Cache  $upstream_cache_status always;
        fastcgi_buffer_size   32k;
        fastcgi_buffers       16 16k;
    }
}
