# Alogweb front web server.
# Serves the WordPress root read-only and proxies PHP to the php-fpm container.

map $http_x_forwarded_proto $alogweb_https {
    default "";
    https   on;
}

# The real client address. Cloudflare sets CF-Connecting-IP and neither the host
# nginx nor this one rewrites it, so it survives both proxies. X-Forwarded-For is
# not usable as a limit key here: this container's peer is always the host nginx.
# Falls back to the peer address during the IP:port test phase, when there is no
# Cloudflare in front and every request legitimately shares one source.
map $http_cf_connecting_ip $alogweb_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Brute force against wp-login.php is the bulk of what shows up in the access
# log of any WordPress host. 20/min is far above what a person logging in needs
# and far below what credential stuffing needs.
limit_req_zone $alogweb_client_ip zone=alogweb_login:10m rate=20r/m;
limit_req_status 429;

# No `keepalive` here and no `fastcgi_keep_conn` below, on purpose. Enabling
# fastcgi keepalive against php-fpm stalls this stack badly under load: measured
# 30 concurrent requests went from 0.11s to 64s for the slowest response, and a
# PHP file that does not even load WordPress showed the same stall. Leave it off.
upstream alogweb_php {
    server alogweb-wordpress:9000;
}

server {
    listen      80 default_server;
    # "_" matches both http://<vps-ip>:<port> during testing and the real
    # domain once DNS is pointed here. No change needed at cutover.
    server_name _;

    root  /var/www/html;
    index index.php;

    client_max_body_size 128M;
    server_tokens off;

    access_log /var/log/nginx/alogweb.access.log;
    error_log  /var/log/nginx/alogweb.error.log warn;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml application/rss+xml
                      image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Container-level health probe. Does not touch PHP.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hidden files, except the ACME challenge used by certbot later.
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Browsers and crawlers request this path regardless of what the markup
    # says, and WordPress would answer it with a 404 page.
    location = /favicon.ico {
        alias /var/www/html/wp-content/themes/apk/assets/icons/favicon.ico;
        expires 30d;
        access_log off;
        log_not_found off;
    }

    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /wp-config.php { deny all; }
    location ~* ^/(readme|license)\.(html|txt)$ { deny all; access_log off; }

    # Files that only exist by accident - logs, dumps, editor leftovers, build
    # manifests. Bots ask for these by name on every WordPress host they find.
    # Must precede the static-asset rule below: among regex locations nginx
    # takes the first match in file order, not the best one.
    location ~* \.(log|sql|bak|old|orig|save|swp|swo|tmp|dist|ini|sh|env|lock|gz|tgz|tar|rar|7z)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|Dockerfile|docker-compose\.ya?ml|wp-content/(debug|error)\.log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Already-installed site: these two only ever answer a scanner.
    location ~* ^/wp-admin/(install|setup-config)\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # No PHP execution from writable content directories.
    location ~* ^/wp-content/.*\.(php|phtml|phar)$ { deny all; }
    location ~* ^/wp-includes/.*\.php$            { deny all; }

    location ~* \.(?:css|js|mjs|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|ogg|pdf|zip|apk)$ {
        expires 30d;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # --- Optional: serve missing media from the live site while testing ------
    # The imported dump references https://apk.alogweb.com/wp-content/uploads/...
    # but a fresh VPS volume has no uploads yet. Uncomment to fall back to the
    # live site for any upload that is not on disk. Remove before DNS cutover.
    #
    # location ^~ /wp-content/uploads/ {
    #     try_files $uri @live_uploads;
    # }
    # location @live_uploads {
    #     proxy_pass         https://apk.alogweb.com;
    #     proxy_set_header   Host apk.alogweb.com;
    #     proxy_ssl_server_name on;
    #     proxy_intercept_errors on;
    # }
    # ------------------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Exact match, so it wins over the regex block below and gets the limiter.
    # burst=10 nodelay lets a real person retype a password without waiting;
    # sustained hammering past that gets 429 instead of reaching PHP at all.
    location = /wp-login.php {
        limit_req zone=alogweb_login burst=10 nodelay;

        try_files $uri =404;
        include snippets/php-fastcgi.conf;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/php-fastcgi.conf;
    }
}
