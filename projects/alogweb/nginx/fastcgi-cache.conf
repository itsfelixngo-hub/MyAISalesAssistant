# Full-page cache for WordPress. This is what makes a PHP-rendered site as fast
# as a static build for anonymous visitors, which is why the site stays on a
# theme instead of going headless.
#
# Must live in the http context; conf.d files are included inside it.

fastcgi_cache_path /var/cache/nginx/fastcgi
                   levels=1:2
                   keys_zone=alogweb_page:32m
                   max_size=512m
                   inactive=12h
                   use_temp_path=off;

fastcgi_cache_key "$scheme$request_method$host$request_uri";

# Anything that sets this to 1 skips the cache, in both directions.
map $http_cookie $alogweb_no_cache_cookie {
    default                              0;
    "~*wordpress_logged_in_"             1;   # editors always see live output
    "~*comment_author_"                  1;
    "~*wp-postpass_"                     1;
}

map $request_method $alogweb_no_cache_method {
    default 0;
    POST    1;
    PUT     1;
    DELETE  1;
    PATCH   1;
}

map $request_uri $alogweb_no_cache_uri {
    default                    0;
    "~*^/wp-admin"             1;
    "~*^/wp-login"             1;
    "~*^/wp-json"              1;
    "~*^/wp-cron\.php"         1;
    "~*^/download-apk"         1;   # depends on ?pid, and is a redirect step
    "~*^/\?s="                 1;   # search results
    "~*^/contact"              1;   # nonce + one-shot captcha token
    "~*alogweb_captcha="       1;   # one image per token, never reused
    "~*sitemap.*\.xml"         1;
    "~*^/feed"                 1;
}

map "$alogweb_no_cache_cookie$alogweb_no_cache_method$alogweb_no_cache_uri" $alogweb_skip_cache {
    default 1;
    "000"   0;
}
