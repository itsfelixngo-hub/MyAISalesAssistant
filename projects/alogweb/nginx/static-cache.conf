# Caching image proxy for post screenshots.
#
# The theme rewrites every *.googleusercontent.com screenshot URL to
# https://static.<site-host>/lh3.googleusercontent.com/<id> (see
# screenshot_rewrite_lh3_in_url() in the theme). This server answers that host
# and proxies to Google, caching on disk so the same image is fetched once.
#
# lh3 serves ids that were originally on play-lh, so rewriting everything to
# lh3 is fine - verified byte-for-byte on a real screenshot id.

# Must live in the http context; conf.d files are included inside it.
proxy_cache_path /var/cache/nginx/static
                 levels=1:2
                 keys_zone=alogweb_static:16m
                 max_size=2g
                 inactive=30d
                 use_temp_path=off;
