# Screenshot proxy over plain HTTP - the default, used during the IP:port
# test phase. docker-compose.ssl.yml swaps this file for static-ssl.conf.
# The cache zone is declared in static-cache.conf.

server {
    listen 80;

    # Matches static.alogweb.com in production and static.localhost while
    # testing, without editing this file at DNS cutover: the theme always
    # builds the host as "static." + the site host.
    server_name ~^static\..+$;

    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    server_tokens off;
    access_log /var/log/nginx/static.access.log;
    error_log  /var/log/nginx/static.error.log warn;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "static ok\n";
    }

    include /etc/nginx/snippets/static-proxy.conf;

    # Nothing else is proxied.
    location / { return 404; }
}
