# Screenshot proxy location, shared by the HTTP and HTTPS static servers.
# Included from nginx/static.conf and nginx/static-ssl.conf.
location /lh3.googleusercontent.com/ {
    proxy_pass https://lh3.googleusercontent.com/;
    proxy_set_header Host lh3.googleusercontent.com;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Do not forward anything that would let a client pin our cache policy
    # or set cookies through us, then publish our own policy below.
    proxy_hide_header alt-svc;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Pragma;

    proxy_cache alogweb_static;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 301 302 30d;
    proxy_cache_valid 404 10m;
    proxy_cache_valid any 1m;
    proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
    # One request populates the cache; the rest wait instead of all
    # hammering Google for the same image.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    # ?nocache=1 bypasses and refreshes the entry.
    proxy_no_cache     $arg_nocache;
    proxy_cache_bypass $arg_nocache;

    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_buffering on;
    proxy_buffers 16 32k;
    proxy_buffer_size 32k;

    # Single Cache-Control only: `expires` would emit a second one.
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
