; PHP-FPM pool tuning for alogweb. The stock image ships pm.max_children = 5,
; which the site exhausts as soon as a handful of requests overlap.
;
; Rough sizing: each WordPress worker uses ~80-120MB, so max_children * 120MB
; should stay well under the VPS RAM. Lower it on a 1-2GB box.
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Surface PHP warnings/fatals in `docker compose logs alogweb-wordpress`.
catch_workers_output = yes
decorate_workers_output = no
